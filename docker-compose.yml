name: personal-blog

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  JWT_ISSUER: ${JWT_ISSUER:-personal-blog}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Set TRUSTED_HOSTS in .env}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
  MEDIA_ROOT: /app/uploads
  MEDIA_PUBLIC_PREFIX: /uploads
  MEDIA_STORAGE_STRATEGY: local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-build: &backend-build
  context: ./backend
  args:
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-personal_blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
      - --table-open-cache=512
    mem_limit: 512m
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging

  backend:
    build: *backend-build
    restart: unless-stopped
    init: true
    environment: *backend-environment
    mem_limit: 384m
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    profiles: ["tools"]
    build: *backend-build
    restart: "no"
    environment: *backend-environment
    mem_limit: 384m
    depends_on:
      mysql:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    init: true
    environment:
      NUXT_API_BASE: http://backend:8000/api/v1
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL in .env}
      NODE_OPTIONS: --max-old-space-size=320
    mem_limit: 384m
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('net');const socket=net.connect(3000,'127.0.0.1',()=>{socket.destroy();process.exit(0)});socket.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/upstreams.conf:/etc/nginx/conf.d/00-upstreams.conf:ro
      - ./docker/nginx/server-common.conf:/etc/nginx/server-common.conf:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  mysql-data:
  uploads:
