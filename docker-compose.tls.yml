# HTTPS termination override. Use with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Place the certificate chain and private key in ./docker/certs as
# fullchain.pem and privkey.pem before starting Nginx. The directory is
# gitignored and must never be committed.
services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/upstreams.conf:/etc/nginx/conf.d/00-upstreams.conf:ro
      - ./docker/nginx/server-common.conf:/etc/nginx/server-common.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - uploads:/var/www/uploads:ro
